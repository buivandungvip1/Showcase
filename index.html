<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Xác Thực & Mua Key /title>
    <style>
        :root {
            --primary-pink: #ff69b4;
            --dark-pink: #c71585;
            --light-pink: #ffb6c1;
            --white: #ffffff;
            --error-red: #d93025;
            --success-green: #1e8e3e;
            --bg-dark: #1a1a2e;
            --card-bg: #16213e;
            --input-bg: #0f3460;
            --border-color: #533483;
            --discord-blue: #5865F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 20% 50%, rgba(199, 21, 133, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, rgba(83, 52, 131, 0.2) 0%, transparent 50%),
                              radial-gradient(circle at 50% 80%, rgba(15, 52, 96, 0.3) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            color: #e0e0e0;
        }

        .hamburger-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            z-index: 1001;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .hamburger-btn:hover {
            border-color: var(--primary-pink);
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        }

        .hamburger-btn span {
            display: block;
            width: 22px;
            height: 2.5px;
            background: var(--primary-pink);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger-btn.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger-btn.active span:nth-child(2) { opacity: 0; }
        .hamburger-btn.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }

        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            position: fixed;
            top: 0; left: -320px;
            width: 300px; height: 100%;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar.active { left: 0; }

        .sidebar-header {
            padding: 25px 20px;
            background: linear-gradient(135deg, #0f3460, #533483);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .sidebar-header h2 {
            color: var(--primary-pink);
            font-size: 1.1rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .sidebar-header p { color: #808090; font-size: 0.75rem; }

        .sidebar-user-info {
            padding: 15px 20px;
            background: rgba(15, 52, 96, 0.3);
            border-bottom: 1px solid rgba(83, 52, 131, 0.2);
            display: none;
            align-items: center;
            gap: 12px;
        }

        .sidebar-user-info.active { display: flex; }

        .sidebar-avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 2px solid var(--primary-pink);
            object-fit: cover;
            background: var(--input-bg);
        }

        .sidebar-user-details { flex: 1; }

        .sidebar-user-details .user-name {
            font-size: 0.9rem;
            color: #e0e0e0;
            font-weight: 600;
        }

        .sidebar-user-details .uid-display {
            font-size: 0.65rem;
            color: var(--primary-pink);
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin-top: 3px;
        }

        .sidebar-balance-box {
            padding: 10px 20px;
            background: rgba(30, 142, 62, 0.15);
            border-bottom: 1px solid rgba(30, 142, 62, 0.3);
            display: none;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-balance-box.active { display: flex; }
        .sidebar-balance-box span { font-size: 0.8rem; color: #a0a0b0; }
        .sidebar-balance-box strong { font-size: 0.95rem; color: #4caf50; }

        .sidebar-nav {
            flex: 1;
            padding: 10px 0;
            overflow-y: auto;
        }

        .nav-section-title {
            padding: 12px 20px 6px;
            font-size: 0.65rem;
            color: #505070;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .nav-item {
            padding: 14px 20px;
            color: #a0a0b0;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-weight: 500;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background: rgba(83, 52, 131, 0.2);
            color: var(--white);
            border-left-color: var(--primary-pink);
        }

        .nav-item.active {
            background: rgba(199, 21, 133, 0.15);
            color: var(--primary-pink);
            border-left-color: var(--primary-pink);
        }

        .nav-item.locked { opacity: 0.4; cursor: not-allowed; }
        .nav-icon { font-size: 1.1rem; width: 24px; text-align: center; }

        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid rgba(83, 52, 131, 0.2);
        }

        .logout-btn {
            background: rgba(217, 48, 37, 0.15);
            border: 1px solid rgba(217, 48, 37, 0.3);
            color: #ef5350;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            font-size: 0.85rem;
            display: none;
        }

        .logout-btn.active { display: block; }
        .logout-btn:hover { background: rgba(217, 48, 37, 0.3); }

        .login-sidebar-btn {
            background: linear-gradient(135deg, var(--dark-pink), #e91e63);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            font-size: 0.85rem;
            display: block;
        }

        .login-sidebar-btn.hidden { display: none; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--card-bg);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .modal-header {
            padding: 25px 20px;
            text-align: center;
            background: linear-gradient(135deg, #0f3460, #533483);
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h3 { color: var(--white); font-size: 1.15rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; }
        .modal-header p { color: #808090; font-size: 0.78rem; margin-top: 6px; }

        .modal-body {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .social-login-btn {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid rgba(83, 52, 131, 0.3);
            background: var(--input-bg);
            color: #e0e0e0;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s ease;
        }

        .social-login-btn:hover { border-color: var(--primary-pink); background: rgba(15, 52, 96, 0.9); }
        .social-login-btn.google { border-left: 4px solid #4285f4; }
        .social-login-btn.facebook { border-left: 4px solid #1877f2; }
        .social-login-btn.discord { border-left: 4px solid var(--discord-blue); }
        .social-login-btn.twitter { border-left: 4px solid #e0e0e0; }
        .social-login-btn.guest { border-left: 4px solid var(--primary-pink); margin-top: 5px; }

        .btn-icon { width: 24px; text-align: center; }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 5px 0;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(83, 52, 131, 0.3); }
        .divider span { font-size: 0.72rem; color: #606080; text-transform: uppercase; letter-spacing: 1px; }

        .modal-close {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(83, 52, 131, 0.3);
            color: #808090;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .modal-close.hidden { display: none; }

        .auth-loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 30px 20px;
        }
        .auth-loading.active { display: flex; }
        .auth-spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,105,180,0.2);
            border-top-color: var(--primary-pink);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .corner-badge {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(22, 33, 62, 0.95);
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 800;
            color: var(--primary-pink);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
            font-size: 1rem;
            border: 1px solid var(--border-color);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 520px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(83, 52, 131, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #0f3460, #533483, var(--dark-pink));
            color: var(--white);
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 { font-size: 1.5rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
        .header p { font-size: 0.85rem; opacity: 0.8; }

        .content {
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; gap: 22px; }

        .deposit-card {
            background: rgba(15, 52, 96, 0.3);
            border: 1px solid rgba(83, 52, 131, 0.3);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            max-width: 260px;
            margin: 0 auto;
        }
        .deposit-card h4 { color: var(--primary-pink); font-size: 0.9rem; margin-bottom: 15px; text-transform: uppercase; }

        .qr-small {
            width: 150px; height: 150px;
            background: var(--white);
            margin: 0 auto 10px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }
        .qr-small img { width: 100%; height: 100%; object-fit: contain; }

        .note-section {
            background: rgba(15, 52, 96, 0.3);
            border: 1px solid rgba(83, 52, 131, 0.3);
            border-radius: 14px;
            padding: 18px;
        }
        .note-section h4 { color: var(--primary-pink); font-size: 0.85rem; margin-bottom: 10px; font-weight: 700; }

        .note-display {
            background: var(--input-bg);
            border: 1px solid rgba(83, 52, 131, 0.4);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #4caf50;
            word-break: break-all;
            user-select: all;
        }

        .copy-note-btn {
            margin-top: 10px;
            padding: 10px;
            background: rgba(83, 52, 131, 0.3);
            border: 1px solid var(--border-color);
            color: var(--light-pink);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            width: 100%;
        }

        .key-shop { display: flex; flex-direction: column; gap: 12px; }
        .key-item {
            background: rgba(15, 52, 96, 0.3);
            border: 1px solid rgba(83, 52, 131, 0.3);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .key-info h4 { color: #e0e0e0; font-size: 0.95rem; margin-bottom: 4px; }
        .key-info p { color: #808090; font-size: 0.75rem; }
        .key-price { color: var(--primary-pink); font-weight: 800; font-size: 1rem; }

        .buy-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--dark-pink), #e91e63);
            border: none;
            color: var(--white);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            box-shadow: 0 4px 15px rgba(199, 21, 133, 0.3);
        }

        .purchased-key-display {
            background: rgba(30, 142, 62, 0.1);
            border: 1px solid rgba(30, 142, 62, 0.3);
            border-radius: 12px;
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .purchased-key-display.active { display: flex; }
        .purchased-key-display h4 { color: #4caf50; font-size: 0.85rem; text-align: center; }

        .key-text-box {
            background: var(--input-bg);
            border: 1px solid rgba(30, 142, 62, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #4caf50;
            text-align: center;
            word-break: break-all;
            user-select: all;
            font-weight: 700;
        }

        .copy-key-btn {
            padding: 10px;
            background: rgba(30, 142, 62, 0.2);
            border: 1px solid rgba(30, 142, 62, 0.4);
            color: #4caf50;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .qr-section { text-align: center; border-bottom: 1px solid rgba(83, 52, 131, 0.3); padding-bottom: 25px; }
        .qr-placeholder {
            width: 180px; height: 180px;
            background: var(--white);
            margin: 0 auto 15px;
            border: 3px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .qr-placeholder img { width: 100%; height: 100%; object-fit: contain; }

        .contact-info { font-size: 0.88rem; color: #a0a0b0; margin-top: 12px; line-height: 1.6; }
        .contact-info strong { color: var(--primary-pink); }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: 600; color: #c0c0d0; font-size: 0.9rem; }
        input {
            padding: 14px 16px;
            border: 2px solid rgba(83, 52, 131, 0.4);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            background: var(--input-bg);
            color: #e0e0e0;
        }
        input:focus { border-color: var(--primary-pink); background: rgba(15, 52, 96, 0.8); }

        button.main-action {
            background: linear-gradient(135deg, var(--dark-pink), #e91e63, #ff4081);
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(199, 21, 133, 0.3);
        }

        .btn-skip {
            background: linear-gradient(135deg, #533483, #0f3460);
            font-size: 0.85rem;
            padding: 12px;
            margin-top: -10px;
            display: none;
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .status-msg {
            padding: 14px 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            line-height: 1.5;
        }
        .status-success { background: rgba(30, 142, 62, 0.15); color: #4caf50; border: 1px solid rgba(30, 142, 62, 0.3); }
        .status-error { background: rgba(217, 48, 37, 0.15); color: #ef5350; border: 1px solid rgba(217, 48, 37, 0.3); }

        .footer {
            background: rgba(10, 10, 20, 0.5);
            padding: 20px;
            text-align: center;
            font-size: 0.78rem;
            color: #606080;
            border-top: 1px solid rgba(83, 52, 131, 0.2);
        }

        .spinner {
            display: none;
            width: 22px; height: 22px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .device-id-display {
            font-size: 0.72rem;
            color: #505070;
            text-align: center;
            margin-top: -8px;
            font-family: 'Courier New', monospace;
        }

        .info-panel {
            background: rgba(15, 52, 96, 0.3);
            border: 1px solid rgba(83, 52, 131, 0.2);
            border-radius: 12px;
            padding: 15px;
        }
        .info-panel h3 { font-size: 0.85rem; color: var(--primary-pink); margin-bottom: 8px; font-weight: 700; }
        .info-panel ul { list-style: none; padding: 0; }
        .info-panel li { font-size: 0.8rem; color: #808090; padding: 3px 0; padding-left: 15px; position: relative; }
        .info-panel li::before { content: '\25B8'; position: absolute; left: 0; color: var(--border-color); }

        .back-btn {
            background: rgba(83, 52, 131, 0.3);
            border: 1px solid var(--border-color);
            color: #a0a0b0;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
    </button>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>SHOP DAME</h2>
            <p>Quản lý tài khoản</p>
        </div>

        <div class="sidebar-user-info" id="sidebarUserInfo">
            <img class="sidebar-avatar" id="sidebarAvatar" src="" alt="Avatar">
            <div class="sidebar-user-details">
                <div class="user-name" id="sidebarUserName"></div>
                <div class="uid-display" id="sidebarUserUid"></div>
            </div>
        </div>

        <div class="sidebar-balance-box" id="sidebarBalanceBox">
            <span>Số dư:</span>
            <strong id="sidebarBalanceText">0đ</strong>
        </div>

        <div class="sidebar-nav">
            <div class="nav-section-title">Chức năng chính</div>
            <div class="nav-item active" id="navActivate" onclick="handleNavClick('activate')">
                <span class="nav-icon">&#9889;</span> Kích hoạt Key
            </div>
            <div class="nav-item locked" id="navDeposit" onclick="handleNavClick('deposit')">
                <span class="nav-icon">&#128176;</span> Nạp tiền &#128274;
            </div>
            <div class="nav-item locked" id="navBuykey" onclick="handleNavClick('buykey')">
                <span class="nav-icon">&#128273;</span> Mua Key &#128274;
            </div>
            <div class="nav-section-title" style="margin-top: 10px;">Tài khoản</div>
            <div class="nav-item" id="navProfile" onclick="handleNavClick('profile')" style="display:none;">
                <span class="nav-icon">&#128100;</span> Thông tin tài khoản
            </div>
        </div>

        <div class="sidebar-footer">
            <button class="login-sidebar-btn" id="loginSidebarBtn" onclick="openLoginModal(true)">Đăng nhập</button>
            <button class="logout-btn" id="logoutBtn" onclick="logoutUser()">Đăng xuất</button>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h3>ĐĂNG NHẬP HỆ THỐNG</h3>
                <p>Chọn phương thức xác thực</p>
            </div>
            <div class="modal-body" id="modalBodyButtons">
                <button class="social-login-btn google" onclick="realSocialLogin('google')">
                    <span class="btn-icon">G</span> Đăng nhập bằng Google
                </button>
                <button class="social-login-btn facebook" onclick="realSocialLogin('facebook')">
                    <span class="btn-icon">f</span> Đăng nhập bằng Facebook
                </button>
                <button class="social-login-btn discord" onclick="realSocialLogin('discord')">
                    <span class="btn-icon">D</span> Đăng nhập bằng Discord
                </button>
                <button class="social-login-btn twitter" onclick="realSocialLogin('twitter')">
                    <span class="btn-icon">𝕏</span> Đăng nhập bằng X (Twitter)
                </button>
                <div class="divider"><span>hoặc</span></div>
                <button class="social-login-btn guest" onclick="guestLogin()">
                    <span class="btn-icon">&#128100;</span> Khách (Tạo UID ngẫu nhiên)
                </button>

    <div class="container">
        <div class="header">
            <h1>Hệ Thống Xác Thực</h1>

        </div>

        <div class="content">

                    <p class="contact-info">

                    <label for="targetName">Tên người muốn dame:</label>
                    <input type="text" id="targetName" placeholder="Nhập tên mục tiêu..." autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="activationKey">Nhập Key kích hoạt:</label>

                </div>

                <p class="device-id-display" id="deviceIdDisplay"></p>

                <button class="main-action" id="submitBtn" onclick="processRequest()">

                <div id="statusMessage" class="status-msg"></div>

                <div class="info-panel">

                    </ul>
                </div>

            <!-- NẠP TIỀN -->
            <div class="tab-content" id="tabDeposit">

                    <button class="copy-note-btn" onclick="copyDepositNote()">Sao chép nội dung</button>

                <button class="back-btn" onclick="switchTab('activate')">&#8592; Quay lại sảnh</button>

            <!-- MUA KEY -->

    <!-- Firebase SDK v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script>
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyBxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
            authDomain: "your-project-id.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project-id.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef1234567890"
        };

        const ADMIN_EMAIL = "buivandungvip1@gmail.com";
        const WEB_NAME = "UID-";

        const LS_KEY_USED = "UID_key_used_flag";
        const LS_DEVICE_ID = "UID_device_id";
        const LS_LAST_SUBMIT = "UID_last_submit_time";
        const LS_USER_ACCOUNT = "UID_user_account";

        let currentUser = null;
        let firebaseApp = null;
        let firebaseAuth = null;
        let firebaseReady = false;

        function initFirebase() {
            if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.includes("xxxx")) {
                console.warn("Chưa cấu hình Firebase API Key thực tế.");
                return false;
            }
            try {
                firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
                firebaseAuth = firebase.auth();
                firebaseReady = true;
                firebaseAuth.onAuthStateChanged(function(user) {
                    if (user) mapFirebaseUserToProfile(user);
                });
                return true;
            } catch (e) {
                console.error("Firebase init failed:", e);
                return false;
            }
        }

        async function mapFirebaseUserToProfile(firebaseUser) {
            const providerId = firebaseUser.providerData[0]?.providerId || 'unknown';
            let providerName = 'Unknown';
            if (providerId.includes('google')) providerName = 'Google';
            else if (providerId.includes('facebook')) providerName = 'Facebook';
            else if (providerId.includes('discord')) providerName = 'Discord';
            else if (providerId.includes('twitter')) providerName = 'X (Twitter)';

            const existingRaw = localStorage.getItem(LS_USER_ACCOUNT);
            let currentBalance = 0;
            if (existingRaw) {
                try {
                    const parsed = JSON.parse(existingRaw);
                    if (parsed.uid === firebaseUser.uid) currentBalance = parsed.balance || 0;
                } catch(e){}
            }

            const user = {
                provider: providerName,
                uid: firebaseUser.uid,
                displayName: firebaseUser.displayName || firebaseUser.email || 'User',
                email: firebaseUser.email || '',
                photoURL: firebaseUser.photoURL || '',
                balance: currentBalance,
                createdAt: firebaseUser.metadata?.creationTime || new Date().toISOString(),
                isFirebase: true
            };
            saveUser(user);
        }

        async function realSocialLogin(provider) {
            if (!firebaseReady && !initFirebase()) {
                showStatus("Firebase chưa được cấu hình đúng trên mã nguồn.", "error");
                showAuthLoading(false);
                return;
            }

            showAuthLoading(true);
            document.getElementById('authLoadingText').textContent = `Đang kết nối ${provider}...`;

            let providerObj;
            if (provider === 'google') providerObj = new firebase.auth.GoogleAuthProvider();
            else if (provider === 'facebook') providerObj = new firebase.auth.FacebookAuthProvider();
            else if (provider === 'discord') providerObj = new firebase.auth.OAuthProvider('discord.com');
            else if (provider === 'twitter') providerObj = new firebase.auth.OAuthProvider('twitter.com');

            try {
                const result = await firebaseAuth.signInWithPopup(providerObj);
                await mapFirebaseUserToProfile(result.user);
                showStatus("Đăng nhập thành công!", "success");
            } catch (error) {
                console.error("Login error:", error);
                showStatus("Lỗi đăng nhập: " + error.message, "error");
            }
            showAuthLoading(false);
        }

        function guestLogin() {
            const uid = generateUID();
            const user = {
                provider: 'Guest',
                uid: uid,
                displayName: 'Khách',
                email: '',
                photoURL: '',
                balance: 0,
                createdAt: new Date().toISOString(),
                isFirebase: false,
                isGuest: true
            };
            saveUser(user);
            showStatus("Đăng nhập Khách thành công!", "success");
            showAuthLoading(false);
        }

        function showAuthLoading(show) {
            document.getElementById('modalBodyButtons').style.display = show ? 'none' : 'flex';
            document.getElementById('authLoading').classList.toggle('active', show);
        }

        function generateUID() {
            const arr = new Uint8Array(12);
            crypto.getRandomValues(arr);
            return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        function loadUser() {
            const raw = localStorage.getItem(LS_USER_ACCOUNT);
            if (raw) {
                try {
                    currentUser = JSON.parse(raw);
                    updateUIForLoggedIn();
                } catch(e) { logoutUser(); }
            } else {
                updateUIForLoggedOut();
            }
        }

        function saveUser(user) {
            currentUser = user;
            localStorage.setItem(LS_USER_ACCOUNT, JSON.stringify(user));
            updateUIForLoggedIn();
            closeLoginModal();
        }

        function updateUIForLoggedIn() {
            if (!currentUser) return;
            document.getElementById('sidebarUserInfo').classList.add('active');
            document.getElementById('sidebarUserName').textContent = currentUser.displayName;
            document.getElementById('sidebarUserUid').textContent = `UID: ${currentUser.uid.substring(0, 14)}...`;
            document.getElementById('sidebarBalanceBox').classList.add('active');
            document.getElementById('sidebarBalanceText').textContent = currentUser.balance.toLocaleString() + 'đ';

            const avatar = document.getElementById('sidebarAvatar');
            avatar.src = currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName)}&background=c71585&color=fff&size=42`;

            document.getElementById('logoutBtn').classList.add('active');
            document.getElementById('loginSidebarBtn').classList.add('hidden');
            document.getElementById('navProfile').style.display = 'flex';
            document.getElementById('depositNote').textContent = `${WEB_NAME} - ${currentUser.uid}`;

            unlockNavigation();
            updateProfileTab();
        }

        function updateUIForLoggedOut() {
            document.getElementById('sidebarUserInfo').classList.remove('active');
            document.getElementById('sidebarBalanceBox').classList.remove('active');
            document.getElementById('logoutBtn').classList.remove('active');
            document.getElementById('loginSidebarBtn').classList.remove('hidden');
            document.getElementById('navProfile').style.display = 'none';
            document.getElementById('depositNote').textContent = 'Vui lòng đăng nhập để xem nội dung chuyển khoản.';
            lockNavigation();
            switchTab('activate');
        }

        function updateProfileTab() {
            if (!currentUser) return;
            document.getElementById('profileInfoList').innerHTML = `
                <li><strong>Nhà cung cấp:</strong> ${currentUser.provider}</li>
                <li><strong>Tên hiển thị:</strong> ${currentUser.displayName}</li>
                <li><strong>UID:</strong> ${currentUser.uid}</li>
                <li><strong>Số dư tài khoản:</strong> <span style="color:#4caf50; font-weight:bold;">${currentUser.balance.toLocaleString()}đ</span></li>
                <li><strong>Thời gian tạo:</strong> ${new Date(currentUser.createdAt).toLocaleString('vi-VN')}</li>
            `;
        }

        function unlockNavigation() {
            ['navDeposit', 'navBuykey'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('locked');
                el.innerHTML = el.innerHTML.replace(' &#128274;', '');
            });
        }

        function lockNavigation() {
            ['navDeposit', 'navBuykey'].forEach(id => {
                const el = document.getElementById(id);
                if (!el.classList.contains('locked')) {
                    el.classList.add('locked');
                    el.innerHTML += ' &#128274;';
                }
            });
        }

        function openLoginModal(forced) {
            const modal = document.getElementById('loginModal');
            modal.classList.add('active');
            document.getElementById('modalCloseBtn').classList.toggle('hidden', forced);
            showAuthLoading(false);
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        async function logoutUser() {
            if (firebaseReady && firebaseAuth) await firebaseAuth.signOut().catch(()=>{});
            localStorage.removeItem(LS_USER_ACCOUNT);
            currentUser = null;
            updateUIForLoggedOut();
            toggleSidebar();
            switchTab('activate');
            showStatus("Đã đăng xuất thành công.", "success");
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
            document.getElementById('hamburgerBtn').classList.toggle('active');
        }

        function handleNavClick(tabName) {
            if (tabName !== 'activate' && tabName !== 'profile' && !currentUser) {
                toggleSidebar();
                openLoginModal(true);
                return;
            }
            switchTab(tabName);
            toggleSidebar();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
            const navMap = { activate: 'navActivate', deposit: 'navDeposit', buykey: 'navBuykey', profile: 'navProfile' };
            document.getElementById(navMap[tabName]).classList.add('active');
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function buyKeyFor2K() {
            if (!currentUser) { openLoginModal(true); return; }
            const price = 2000;
            if (currentUser.balance < price) {
                showStatus(`Số dư không đủ (${currentUser.balance.toLocaleString()}đ). Vui lòng nạp thêm tiền!`, "error");
                switchTab('deposit');
                return;
            }

            currentUser.balance -= price;
            saveUser(currentUser);

            const hashedHex = await sha256(`${currentUser.uid}-${Date.now()}-${Math.random()}`);
            const secureKey = `UID-2K-${hashedHex.substring(0, 16).toUpperCase()}`;

            document.getElementById('purchasedKeyText').textContent = secureKey;
            document.getElementById('purchasedKeyDisplay').classList.add('active');
            showStatus("Mua Key thành công!", "success");
        }

        function copyPurchasedKey() {
            navigator.clipboard.writeText(document.getElementById('purchasedKeyText').textContent).then(() => {
                const btn = document.querySelector('.copy-key-btn');
                btn.textContent = 'Đã sao chép!';
                setTimeout(() => btn.textContent = 'Sao chép Key', 2000);
            });
        }

        function copyDepositNote() {
            if (!currentUser) { openLoginModal(true); return; }
            navigator.clipboard.writeText(document.getElementById('depositNote').textContent).then(() => {
                const btn = document.querySelector('.copy-note-btn');
                btn.textContent = 'Đã sao chép nội dung!';
                setTimeout(() => btn.textContent = 'Sao chép nội dung', 2000);
            });
        }

        function getOrCreateDeviceId() {
            let did = localStorage.getItem(LS_DEVICE_ID);
            if (!did) {
                const arr = new Uint8Array(16);
                crypto.getRandomValues(arr);
                did = Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
                localStorage.setItem(LS_DEVICE_ID, did);
            }
            return did;
        }

        const DEVICE_ID = getOrCreateDeviceId();

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('deviceIdDisplay').textContent = `DEVICE: ${DEVICE_ID.substring(0, 8).toUpperCase()}...`;
            initFirebase();
            loadUser();
            if (localStorage.getItem(LS_KEY_USED) === "true") {
                lockInterface("Thiết bị này đã sử dụng key.", "success");
                document.getElementById('skipBtn').style.display = 'block';
            }
            if (!currentUser) setTimeout(() => openLoginModal(true), 600);
        });

        function lockInterface(msg) {
            document.getElementById('activationKey').disabled = true;
            document.getElementById('targetName').disabled = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('btnText').textContent = "ĐÃ KHÓA THIẾT BỊ";
            if (msg) showStatus(msg, "success");
        }

        function skipAndReset() {
            localStorage.removeItem(LS_KEY_USED);
            localStorage.removeItem(LS_LAST_SUBMIT);
            document.getElementById('activationKey').disabled = false;
            document.getElementById('targetName').disabled = false;
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('btnText').textContent = "Gửi Đơn & Xác Thực";
            document.getElementById('skipBtn').style.display = 'none';
            showStatus("Đã reset. Nhập key mới.", "success");
        }

        function showStatus(msg, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = msg;
            el.className = 'status-msg ' + (type === 'success' ? 'status-success' : 'status-error');
            el.style.display = 'block';
        }

        async function processRequest() {
            if (!currentUser) { openLoginModal(true); return; }
            const target = document.getElementById('targetName').value.trim();
            const key = document.getElementById('activationKey').value.trim();

            if (!target || target.length < 2) { showStatus("Nhập tên mục tiêu hợp lệ.", "error"); return; }
            if (!key) { showStatus("Vui lòng nhập Key kích hoạt.", "error"); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            document.getElementById('btnText').style.display = 'none';
            document.getElementById('btnSpinner').style.display = 'block';

            const formData = new FormData();
            formData.append("Tên Mục Tiêu", target);
            formData.append("Key", key);
            formData.append("Device ID", DEVICE_ID);
            formData.append("UID", currentUser.uid);
            formData.append("User Name", currentUser.displayName);
            formData.append("_subject", `[KEY SYSTEM] Đơn kích hoạt - ${target}`);

            try {
                await fetch(`https://formsubmit.co/ajax/${ADMIN_EMAIL}`, { method: "POST", body: formData });
                localStorage.setItem(LS_KEY_USED, "true");
                lockInterface("Gửi đơn thành công! Thiết bị đã bị khóa.");
                document.getElementById('skipBtn').style.display = 'block';
            } catch(e) {
                showStatus("Lỗi kết nối khi gửi đơn.", "error");
                btn.disabled = false;
            } finally {
                document.getElementById('btnText').style.display = 'block';
                document.getElementById('btnSpinner').style.display = 'none';
            }
        }
    </script>
